[project]
name = "ha-plant-monitor-plus"
version = "0.0.0"
description = "HA-Plant-Monitor-Plus - A Home Assistant integration to create plant monitors"
authors = [{ email = "Andrew Jackson <andrew@codechimp.org>" }]
maintainers = [{ email = "Andrew Jackson <andrew@codechimp.org>" }]

readme = "README.md"
license = "MIT"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3",
]
requires-python = ">=3.14.2"
dependencies = [] # Use dev for all dependencies

[project.urls]
documentation = "https://github.com/andrew-codechimp/HA-Plant-Monitor-Plus"
homepage = "https://github.com/andrew-codechimp/HA-Plant-Monitor-Plus"
repository = "https://github.com/andrew-codechimp/HA-Plant-Monitor-Plus"
"Bug Tracker" = "https://github.com/andrew-codechimp/HA-Plant-Monitor-Plus/issues"
Changelog = "https://github.com/andrew-codechimp/HA-Plant-Monitor-Plus/releases"

[dependency-groups]
dev = [
    "aiodhcpwatcher",
    "aiodiscover",
    "aiodns",
    "aioesphomeapi",
    "aiousbwatcher",
    "awesomeversion",
    "async-upnp-client",
    "av",
    "bleak_esphome",
    "colorlog",
    "debugpy",
    "esphome_dashboard_api",
    "go2rtc_client",
    "ha-ffmpeg",
    "hassil",
    "home-assistant-intents",
    "homeassistant==2026.7.0",
    "infrared-protocols",
    "mutagen",
    "mypy",
    "pycares",
    "pygments",
    "pymicro-vad",
    "pyotp",
    "pyqrcode",
    "pyserial",
    "pytest-homeassistant-custom-component",
    "pyturbojpeg",
    "ruff",
]

[tool.uv]
default-groups = ["dev"]
[tool.ruff]
target-version = "py314"
src = ["custom_components/plant_monitor_plus"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # Annotation and type hint rules
  "ANN401", # Disallowing dynamically typed expressions (too strict)

  # Docstring convention conflicts
  "D202", # No blank lines allowed after function docstring
  "D203", # 1 blank line required before class docstring
  "D213", # Multi-line docstring summary should start at the second line
  "D404", # First word of the docstring should not be "This"
  "D406", # Section name should end with a newline
  "D407", # Section name underlining
  "D411", # Missing blank line before section

  # Style/tidiness adjustments
  "TID252", # Relative imports
  "E731",   # Do not assign a lambda expression, use a def

  # Formatting conflicts (black/ruff fmt)
  "COM812",
  "COM819",
  "D206",
  "E501",   # Line too long (handled by formatter)
  "ISC001",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",
  "RUF012", # Broken rule in some cases

  # GitHub actions
  "INP001",  # File is part of an implicit namespace package

  # Project preference
  "ERA001",  # Found commented-out code
  "FBT001",  # Boolean-typed positional argument in function definition
  "FBT002",  # Boolean-typed positional argument in function definition
  "S101",    # Use of assert detected
  "TC001",   # Move application import into type checking
  "TC006",   # Add quotes to type expression in typing.cast()
  "FIX002",  # TODO
  "TD002",   # Missing author in TODO
  "TD003",   # Missing issue link TODO
  "CPY001",  # Copyright notice
]


[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.isort]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
known-first-party = ["homeassistant"]
combine-as-imports = true

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"homeassistant.helpers.area_registry" = "ar"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"
"homeassistant.helpers.issue_registry" = "ir"
voluptuous = "vol"

[tool.mypy]
# Specify the target platform details in config, so your developers are
# free to run mypy on Windows, Linux, or macOS and get consistent
# results.
python_version = "3.14"
platform = "linux"
explicit_package_bases = true

# show error messages from unrelated files
follow_imports = "normal"

# suppress errors about unsatisfied imports
ignore_missing_imports = true

# be strict
check_untyped_defs = true
# disallow_any_generics = true
# disallow_incomplete_defs = true
# disallow_subclassing_any = true
# disallow_untyped_calls = true
# disallow_untyped_decorators = true
# disallow_untyped_defs = true
# no_implicit_optional = true
# strict_optional = true
# warn_incomplete_stub = true
# warn_no_return = true
# warn_redundant_casts = true
# warn_return_any = true
# warn_unused_configs = true
# warn_unused_ignores = true
