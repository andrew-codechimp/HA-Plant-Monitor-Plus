get_plant_summary:
  name: Get plant summary
  description: Return all plant entries and categorized lists.
  fields: {}

set_plant_thresholds:
  name: Set plant thresholds
  description: Set the thresholds for a plant.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: plant_monitor_plus
    moisture_minimum:
      required: false
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    moisture_maximum:
      required: false
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

set_plant_watered:
  name: Set plant watered
  description: Set the last watered timestamp for a plant.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: plant_monitor_plus
    datetime:
      selector:
        datetime:
